project:
  type: default
  output-dir: _output

lang: en
date-format: "MMMM YYYY"

title: "Company Handbook"
subtitle: "How we work at Example Company"
author: "Example Company GmbH"
date: "November 2026"

format:
  pdf:
    pdf-engine: xelatex
    papersize: a4
    geometry: [margin=2.5cm, top=3cm, headheight=1.3cm]
    mainfont: "DejaVu Serif"
    monofont: "DejaVu Sans Mono"
    colorlinks: true
    linestretch: 1.15
    toc: true
    toc-depth: 2
    number-sections: true
    include-in-header:
      text: |
        \usepackage{scrlayer-scrpage}
        \clearpairofpagestyles
        \renewcommand*{\titlepagestyle}{scrheadings}
        \pagestyle{scrheadings}
        \ihead{\small\textcolor{gray}{Company Handbook}}
        \ohead{\includegraphics[height=1.0cm]{images/logo.png}}
        \cfoot{\small\pagemark}
        \setkomafont{pageheadfoot}{\normalfont}
  html:
    theme: cosmo
    toc: true
    toc-depth: 2
    number-sections: true
    embed-resources: true
  docx:
    toc: true
    number-sections: true
  epub:
    toc: true
    number-sections: true
    cover-image: images/logo.png
